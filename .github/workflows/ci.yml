name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: pytest (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install native HID dependencies
        # The `hid` package is pure-python ctypes bindings and loads the system
        # libhidapi at import time, so the native library must be present.
        run: |
          sudo apt-get update
          sudo apt-get install -y libhidapi-dev libusb-1.0-0-dev libudev-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest
